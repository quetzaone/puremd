name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with:
          node-version: 22
          cache: npm
      - run: npm.cmd ci --ignore-scripts
      - run: npm.cmd audit --omit=dev --package-lock-only
      # The only automated check of the rendering pipeline: that rehype-raw runs
      # ahead of the sanitizer and only in Extended mode, and that Safe mode never
      # gets the wider schema. THREAT_MODEL.md names it as the thing that asserts
      # both, so it belongs on every pull request.
      - run: npm.cmd run check
      - run: npm.cmd run build
      - run: cargo test --locked
        working-directory: src-tauri
      - run: cargo check --locked
        working-directory: src-tauri
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit Rust dependencies
        working-directory: src-tauri
        run: cargo audit
